name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.3"
  PHP_EXTENSIONS: intl, pdo_pgsql, redis, zip, apcu

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Security audit of dependencies
        run: composer audit

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: seller_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d seller_api_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/seller_api_test?serverVersion=16&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379?timeout=1&read_timeout=1
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate Doctrine mapping against the migrated schema
        run: php bin/console doctrine:schema:validate

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Functional tests (REST API, rate limiter, idempotency, cache)
        run: vendor/bin/phpunit --testsuite functional --coverage-text --colors=never

  docker:
    name: Production image
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: seller-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint the compiled container of the production image
        run: |
          docker run --rm \
            -e APP_SECRET=ci -e JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef -e API_KEY_PEPPER=ci \
            -e DATABASE_URL="postgresql://ci:ci@localhost:5432/ci?serverVersion=16&charset=utf8" \
            -e REDIS_URL="redis://localhost:6379" \
            seller-api:ci php bin/console lint:container --env=prod --no-debug
