monolog:
    channels:
        - deprecation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: 'php://stderr'
                level: debug
                channels: ['!event']

when@test:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: error
                channels: ['!event']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: warning
                handler: stderr_json
                excluded_http_codes: [404, 405]
                buffer_size: 50
            stderr_json:
                type: stream
                path: 'php://stderr'
                level: debug
                formatter: monolog.formatter.json
